name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.8
  ACTIONLINT_SHA256: be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a
  IMAGE_NAME: wordpress
  TRIVY_VERSION: v0.69.3

jobs:
  validate:
    name: Validate Workflows And Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read WordPress version
        run: scripts/read-wp-version.sh Dockerfile

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions
        run: actionlint

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml"); YAML.load_file(".github/workflows/release.yml")'

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          trivyignores: .trivyignore.yaml
          hide-progress: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}

  image:
    name: Build And Test (${{ matrix.arch }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=wordpress-ci-${{ github.event_name }}-${{ github.ref_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wordpress-ci-${{ github.event_name }}-${{ github.ref_name }}-${{ matrix.arch }}
          no-cache-filters: runtime

      - name: Verify image architecture
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_TAG")"
          test "$actual_platform" = "$EXPECTED_PLATFORM"

      - name: Run generic container smoke tests
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.arch }}
        run: scripts/smoke-wordpress-container.sh "$IMAGE_TAG"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.arch }}
          hide-progress: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}
